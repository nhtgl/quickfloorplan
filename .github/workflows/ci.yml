name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PDF export cannot be tested in jsdom: it has no SVG layout, so svg2pdf reads
      # null coordinates there. This drives the built app in a real browser instead.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: PLAYWRIGHT_CHANNEL=chromium node scripts/verify-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-output
          path: .verify/
          retention-days: 7

  image:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: quickfloorplan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Serve it and check it answers
        run: |
          docker run -d --name qfp -p 8080:8080 quickfloorplan:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q "<title>QuickFloorPlan</title>"
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
          docker rm -f qfp
