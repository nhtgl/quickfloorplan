name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Tries to turn Pages on by itself. Some repositories will not let a workflow
      # token do that, so a failure here is reported rather than silently fatal, and
      # the next step says exactly which setting to change.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Explain what to do if Pages is not enabled
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::Open Settings -> Pages on this repository and set 'Build and deployment' -> Source to 'GitHub Actions', then re-run this workflow. The workflow token was not allowed to switch it on by itself."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vite is configured with a relative base, so the build works unchanged under
      # the /quickfloorplan/ path a project site is served from.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
