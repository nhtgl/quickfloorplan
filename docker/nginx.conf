server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript image/svg+xml application/json;

    include /etc/nginx/conf.d/security-headers.conf;

    # No routing to speak of, but an unknown path should still land on the app
    # rather than an nginx error page.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # The entry document must not be cached, or a deploy never reaches anyone.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
    }
}
