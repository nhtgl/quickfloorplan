# nginx only inherits add_header from an outer block when the inner block declares
# none of its own. Any location that sets a cache header therefore has to repeat
# these, so they live in one file and get included wherever they are needed.

# Everything runs in the browser and talks to nothing, so the page is confined to its
# own origin. blob: and data: are needed for the PDF export and for stored photos.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
